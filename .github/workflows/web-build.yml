name: Web build

on:
  # Web UI is already verified on every main push by kaerunote-check.yml.
  # Run artifact packaging only when explicitly requested.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock=false
      - run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: canvas-web-build
          path: public/canvas/
          if-no-files-found: error
