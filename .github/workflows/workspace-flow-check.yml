name: KaeruNote workspace flow
on:
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/workspace-flow-check.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/workspace-flow-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: npm test
      - run: VITE_APP_COMMIT=1111111 npm run build
      - run: node tests/workspace-flow.cjs
      - run: node tests/tablet-ink.cjs
      - run: node tests/drawing-modes.cjs
      - run: node tests/canvas-toolbox.cjs
      - run: node tests/workspace-shortcuts.cjs
      - run: node tests/organizer-flow.cjs
      - run: node tests/note-offline.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-flow-views
          path: |
            /tmp/kaeru-workspace-*.png
            /tmp/kaeru-organizer-*.png
            /tmp/kaeru-offline*.png
            /tmp/kaeru-tablet-ink*.png
            /tmp/kaeru-drawing-*.png
            /tmp/kaeru-canvas-toolbox-*.png
            /tmp/kaeru-shortcuts-*.png
          if-no-files-found: ignore
