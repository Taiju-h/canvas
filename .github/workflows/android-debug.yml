name: Android web shell debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "clients/android/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build bundled web UI
        run: |
          npm install --package-lock=false
          npm run build
          rm -rf clients/android/app/src/main/assets/canvas
          mkdir -p clients/android/app/src/main/assets
          cp -a public/canvas clients/android/app/src/main/assets/canvas

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build debug APK
        working-directory: clients/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: canvas-android-debug
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
