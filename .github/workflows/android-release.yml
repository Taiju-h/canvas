name: KaeruNote release installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/android/app/build.gradle.kts'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'clients/android/app/build.gradle.kts'
      - '.github/workflows/android-release.yml'
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build bundled web UI
        run: |
          npm install --package-lock=false
          VITE_APP_COMMIT="$GITHUB_SHA" npm run build
          rm -rf clients/android/app/src/main/assets/canvas
          mkdir -p clients/android/app/src/main/assets
          cp -a public/canvas clients/android/app/src/main/assets/canvas

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 secret is missing" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/canvas-release.jks"

      - name: Build signed APK and AAB
        working-directory: clients/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/canvas-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/KaeruNote-0.4.2.apk"
          cp app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/KaeruNote-0.4.2.aab"

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: KaeruNote-0.4.2-release
          path: |
            clients/android/app/build/outputs/apk/release/KaeruNote-0.4.2.apk
            clients/android/app/build/outputs/bundle/release/KaeruNote-0.4.2.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clients/android/app/build/outputs/apk/release/KaeruNote-0.4.2.apk
            clients/android/app/build/outputs/bundle/release/KaeruNote-0.4.2.aab
          generate_release_notes: true
