name: Category overlay checks

on:
  pull_request:
    paths:
      - 'src/components/note-categories.tsx'
      - 'src/notes.css'
      - 'tests/category-overlay.cjs'
      - '.github/workflows/category-overlay-check.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/note-categories.tsx'
      - 'src/notes.css'
      - 'tests/category-overlay.cjs'
      - '.github/workflows/category-overlay-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  categories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Web build
        run: npm run build
      - name: Confirm the October 11 regression
        run: |
          if node tests/category-overlay.cjs --baseline > /tmp/category-baseline.log 2>&1; then
            echo "Baseline unexpectedly passed"
            exit 1
          fi
          cat /tmp/category-baseline.log
          grep -q 'leaf-only children must use their own overlay pane' /tmp/category-baseline.log
      - name: Verify category interactions
        run: node tests/category-overlay.cjs
      - name: Upload test views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: category-overlay-views
          path: /tmp/kaeru-category-overlay-*.png
          if-no-files-found: ignore
